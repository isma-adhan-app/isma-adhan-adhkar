name: build-windows

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: python -m pytest tests/ -q

      - name: Source-level entry self-test
        env:
          SDL_AUDIODRIVER: dummy
        run: python launcher.py --self-test

      - name: Build onedir app
        run: pyinstaller IsmaAdhan.spec

      - name: Packaged headless self-test
        env:
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\IsmaAdhan\app.log" -ErrorAction SilentlyContinue
          .\dist\IsmaAdhan\IsmaAdhan.exe --self-test
          Start-Sleep -Seconds 2
          $log = Get-Content "$env:APPDATA\IsmaAdhan\app.log" -Raw -ErrorAction Stop
          Write-Host $log
          if ($log -notmatch 'startup: entry') { throw 'frozen exe never reached app code (entry import broken)' }
          if ($log -notmatch 'self-test result: PASS') { throw 'packaged self-test did not pass - see log above' }

      - name: GUI launch smoke test (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\IsmaAdhan\app.log" -ErrorAction SilentlyContinue
          $p = Start-Process .\dist\IsmaAdhan\IsmaAdhan.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Warning "GUI exited early (code $($p.ExitCode)) - expected in session 0"; Get-Content "$env:APPDATA\IsmaAdhan\app.log" -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "GUI process alive after 20s, pid $($p.Id)"
          Stop-Process -Id $p.Id -Force
          $log = Get-Content "$env:APPDATA\IsmaAdhan\app.log" -Raw -ErrorAction SilentlyContinue
          Write-Host $log
          if ($log -notmatch 'startup: window shown') { Write-Warning 'window-shown milestone missing from app.log'; exit 1 }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: iscc build\installer.iss

      - name: Zip portable onedir (fallback)
        shell: pwsh
        run: Compress-Archive -Path dist\IsmaAdhan -DestinationPath dist\IsmaAdhan-portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsmaAdhan-installer
          path: |
            dist/installer/IsmaAdhan-Setup.exe
            dist/IsmaAdhan-portable.zip
          retention-days: 30

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v1.2-build$env:GITHUB_RUN_NUMBER"
          gh release create $tag dist/installer/IsmaAdhan-Setup.exe dist/IsmaAdhan-portable.zip --title "IsmaAdhan $tag" --notes "Automated build $env:GITHUB_RUN_NUMBER. v1.2: startup Bismillah before any other sound, Hijri + Gregorian dates in Arabic words with screen-reader access. Earlier: v1.1: country+city picker for 244 countries with Windows auto-detection, per-prayer adhan sounds, per-prayer pre-adhan / iqama / post-prayer adhkar alerts, 14 bundled adhkar clips (license-safe TTS), v1.0 settings migrate automatically. Onedir + Inno Setup installer (reduced antivirus false positives). Unit tests and packaged self-test passed. Install: run IsmaAdhan-Setup.exe; portable fallback: unzip IsmaAdhan-portable.zip and run IsmaAdhan.exe inside." --latest
